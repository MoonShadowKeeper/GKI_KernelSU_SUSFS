name: GetManager
permissions:
  contents: write
  actions: read

on:
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string

jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Установка зависимостей
        run: sudo apt update && sudo apt install -y git curl jq unzip

      - name: Определение версии и переменных
        id: setup_env
        run: |
          # Инициализация переменных
          REPO=""
          WORKFLOW_FILE=""
          
          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "Variant: Next"
            git clone https://github.com/KernelSU-Next/KernelSU-Next.git ksu-source
            cd ksu-source
            KSU_GIT_VERSION=$(git rev-list --count HEAD)
            KSU_VERSION=$((10000 + KSU_GIT_VERSION + 200))
            
            echo "REPO=KernelSU-Next/KernelSU-Next" >> $GITHUB_ENV
            echo "WORKFLOW_FILE=build-manager.yml" >> $GITHUB_ENV # Проверьте имя файла в репозитории!
            
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "Variant: SukiSU"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git ksu-source
            cd ksu-source
            KSU_GIT_VERSION=$(git rev-list --count HEAD)
            KSU_VERSION=$((10000 + KSU_GIT_VERSION + 700))
            
            echo "REPO=SukiSU-Ultra/SukiSU-Ultra" >> $GITHUB_ENV
            echo "WORKFLOW_FILE=build-manager.yml" >> $GITHUB_ENV
            
          else
            echo "::error::Неизвестный вариант: ${{ inputs.kernelsu_variant }}"
            exit 1
          fi
          
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          echo "Calculated Version: $KSU_VERSION"
          
          # Удаляем исходники, чтобы не мешались
          cd .. && rm -rf ksu-source

      - name: Скачивание KernelSU Manager
        run: |
          echo "Поиск артефактов в $REPO (Workflow: $WORKFLOW_FILE)..."

          # 1. Получаем ID последнего успешного запуска (исправлены кавычки на двойные)
          # Используем per_page=1 для скорости
          BUILD_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?status=success&per_page=1")
          
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.workflow_runs[0].id')
          
          if [ "$BUILD_ID" == "null" ] || [ -z "$BUILD_ID" ]; then
            echo "::error::Не удалось найти успешный билд! Ответ API:"
            echo "$BUILD_JSON"
            exit 1
          fi
          
          echo "Найден Build ID: $BUILD_ID"

          # 2. Получаем список артефактов этого билда
          ARTIFACTS_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")

          # 3. Ищем ссылку на скачивание (используем test для игнорирования регистра Manager/manager)
          DOWNLOAD_URL=$(echo "$ARTIFACTS_JSON" | jq -r '.artifacts[] | select(.name | test("Manager"; "i")) | .archive_download_url' | head -n 1)

          if [ "$DOWNLOAD_URL" == "null" ] || [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Артефакт с именем 'Manager' не найден!"
            echo "Доступные артефакты:"
            echo "$ARTIFACTS_JSON" | jq -r '.artifacts[].name'
            exit 1
          fi

          echo "Ссылка получена. Скачивание..."
          
          # 4. Скачивание
          # Важно: используем -L для редиректов.
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o manager.zip "$DOWNLOAD_URL"

          # Проверка, что файл скачался и он не пустой (и не JSON с ошибкой)
          if [ ! -s manager.zip ]; then
             echo "::error::Файл manager.zip пуст или не скачался."
             exit 1
          fi
          
          # Распаковка
          unzip -o manager.zip -d extracted_manager
          
          # Подготовка файла для загрузки (находим APK где бы он ни был и переименовываем)
          APK_PATH=$(find extracted_manager -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK файл не найден внутри архива!"
            ls -R extracted_manager
            exit 1
          fi
          
          echo "Найден APK: $APK_PATH"
          mv "$APK_PATH" "${{ inputs.kernelsu_variant }}-Manager-v${{ env.KSU_VERSION }}.apk"

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager-v${{ env.KSU_VERSION }}
          path: ${{ inputs.kernelsu_variant }}-Manager-v${{ env.KSU_VERSION }}.apk
